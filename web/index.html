<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16110d">
  <title>The Last Laundromat</title>
  <link rel="preload" href="assets/fonts/PatrickHand-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Fraunces.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game">
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-title"><span class="boot-the">THE LAST</span><span class="boot-name">Laundromat</span></div>
        <div class="boot-bar"><div class="boot-fill"></div></div>
        <div class="boot-msg">Warming up the machines…</div>
      </div>
    </div>
  </div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
  <script nomodule>
    // Very old WebViews can't run the game's JavaScript modules.
    document.querySelector('.boot-msg').textContent = 'This device\'s web engine is too old to run the game. Please update "Android System WebView" (or Chrome) from the Play Store, then reopen.';
  </script>
  <script>
    // The game needs a WebView from 2021 or later (Chromium 88+); tell users of outdated ones how to fix it.
    try {
      new Function('var a = {}; return a?.b ?? 1;');
      if (window.CSS && CSS.supports && !CSS.supports('aspect-ratio', '1 / 1')) throw new Error('old css');
    } catch (e) {
      document.querySelector('.boot-msg').textContent = 'This device\'s web engine is too old to run the game. Please update "Android System WebView" (or Chrome) from the Play Store, then reopen.';
    }
    // If nothing has started after a while, say so rather than spinning forever.
    setTimeout(function () {
      var b = document.getElementById('boot'), m = document.querySelector('.boot-msg');
      if (b && m && !b.classList.contains('gone') && !/wrong|too old/.test(m.textContent)) m.textContent = 'Still loading… if this takes more than a minute, try closing and reopening the game.';
    }, 30000);
  </script>
</body>
</html>
